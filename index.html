<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MACERA!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap');

        /* TÜM SAYFADA MUZ İMLECİ */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Roboto', sans-serif;
            touch-action: none;
            user-select: none;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" style="font-size:24px"><text y="24">🍌</text></svg>'), auto;
        }

        button, input, #gameCanvas {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" style="font-size:24px"><text y="24">🍌</text></svg>'), auto !important;
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #2b2b2b, #1a1a1a);
        }

        /* UI Katmanı */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
            display: none;
            width: 90%;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #555;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            margin-bottom: 10px;
            display: inline-block;
            margin-right: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .gold-icon { color: #f1c40f; }

        /* Mağaza Butonu */
        #shop-toggle-btn {
            pointer-events: auto;
            background: #e67e22;
            transition: transform 0.1s;
            border: 2px solid #fff;
        }
        #shop-toggle-btn:active { transform: scale(0.95); }

        /* Yükleme Ekranı */
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            color: white;
        }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Mağaza / Menü Ekranı */
        #menu-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 50;
            color: white;
        }

        h1.game-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 32px;
            background: -webkit-linear-gradient(#eee, #333);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0px 4px 10px rgba(255,255,255,0.1);
        }

        .menu-container {
            background: #2c3e50;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 2px solid #444;
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .name-input-container {
            width: 100%;
            margin-bottom: 10px;
            text-align: center;
        }
        .name-input-container label {
            display: block;
            font-size: 10px;
            color: #aaa;
            margin-bottom: 5px;
            font-family: 'Press Start 2P', cursive;
        }
        #name-input {
            width: 60%;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #34495e;
            background: #1a252f;
            color: white;
            font-size: 16px;
            text-align: center;
            font-family: 'Roboto', sans-serif;
            font-weight: bold;
            outline: none;
        }
        #name-input:focus { border-color: #3498db; }

        .action-area {
            width: 100%;
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #444;
        }

        button.menu-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            font-weight: bold;
            font-family: 'Press Start 2P', cursive;
            flex: 1;
            transition: all 0.2s;
        }
        button.menu-btn:hover { filter: brightness(1.1); transform: scale(1.02); }
        button.menu-btn.close { background: #e74c3c; flex: 0 0 60px; }

        .shop-section-title {
            width: 100%;
            text-align: left;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            margin: 10px 0;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
            font-family: 'Press Start 2P', cursive;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
        }

        .shop-item {
            background: #1a252f;
            border: 2px solid #34495e;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .shop-item:hover { border-color: #3498db; transform: translateY(-2px); }
        .shop-item.selected { border-color: #2ecc71; box-shadow: 0 0 10px rgba(46, 204, 113, 0.4); }
        .shop-item.locked { opacity: 0.6; }

        .preview-canvas { width: 50px; height: 50px; margin-bottom: 5px; }
        .color-preview { width: 40px; height: 40px; margin-bottom: 5px; display: flex; justify-content: center; align-items: center; }

        .item-name { font-size: 9px; font-weight: bold; margin-bottom: 5px; color: #ccc; }
        .item-price { font-family: 'Press Start 2P', cursive; font-size: 9px; color: #f1c40f; margin-top: auto; }
        
        .owned-tag { color: #2ecc71; font-size: 9px; font-weight: bold; margin-top: auto; }

        #total-gold-display {
            font-family: 'Press Start 2P', cursive;
            color: #f1c40f;
            font-size: 14px;
            margin-bottom: 10px;
            background: #000;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #f1c40f;
        }

        #message-box {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: #fff; padding: 30px; border-radius: 12px;
            text-align: center; border: 2px solid #00ffcc;
            display: none; box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            z-index: 60;
        }
        #message-box h1 { margin-top: 0; font-family: 'Press Start 2P', cursive; font-size: 18px; line-height: 1.5; }
        
        #mobile-controls {
            display: none; position: absolute; bottom: 20px; width: 100%;
            height: 100px; pointer-events: none; z-index: 20;
        }
        .control-btn {
            position: absolute; width: 70px; height: 70px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; pointer-events: auto;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 24px; user-select: none;
            backdrop-filter: blur(4px);
        }
        .control-btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.95); }
        #btn-left { left: 20px; bottom: 10px; }
        #btn-right { left: 100px; bottom: 10px; }
        #btn-jump { right: 20px; bottom: 10px; }
        @media (hover: none) and (pointer: coarse) { #mobile-controls { display: block; } }

    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader"></div>
        <div style="font-family: 'Press Start 2P'; font-size: 12px; margin-top: 10px;">YÜKLENİYOR...</div>
    </div>

    <div id="menu-screen">
        <h1 class="game-title">MACERA!</h1>
        <div id="total-gold-display">ALTIN: 0</div>
        
        <div class="menu-container">
            <div class="name-input-container">
                <label>İSMİNİ YAZ:</label>
                <input type="text" id="name-input" value="Can" maxlength="12">
            </div>

            <div class="action-area">
                <button id="close-menu-btn" class="menu-btn close" style="display:none;">X</button>
                <button id="play-btn" class="menu-btn">OYUNA BAŞLA</button>
            </div>

            <div class="shop-section-title">KOSTÜMLER</div>
            <div class="shop-grid" id="skin-grid"></div>

            <div class="shop-section-title">İSİM RENKLERİ</div>
            <div class="shop-grid" id="color-grid"></div>
        </div>
    </div>

    <div id="ui-layer">
        <div class="stat-box" id="ui-name-box">OYUNCU</div>
        <div class="stat-box">LVL: <span id="level-display">1</span>/70</div>
        <div class="gold-icon stat-box">● <span id="game-gold">0</span></div>
        <div class="stat-box" id="shop-toggle-btn">MAĞAZA (C)</div>
        <div class="stat-box" style="float:right">FPS: <span id="fps">60</span></div>
    </div>

    <div id="message-box">
        <h1 id="msg-title">BÖLÜM BİTTİ</h1>
        <p id="msg-text">Skor: 0</p>
        <button id="next-level-btn" class="menu-btn" style="font-size:12px; padding:10px;">DEVAM ET</button>
    </div>

    <div id="mobile-controls">
        <div id="btn-left" class="control-btn">←</div>
        <div id="btn-right" class="control-btn">→</div>
        <div id="btn-jump" class="control-btn">▲</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const PLAYER_W = 30;
        const PLAYER_H = 40;
        const GRAVITY = 0.6;
        const JUMP_FORCE = -12;
        const FRICTION = 0.8;
        const TOTAL_LEVELS = 70;

        let gameState = 'LOADING'; 
        let currentLevel = 1;
        let totalGold = 0;
        let score = 0;
        let playerName = "Can";
        
        let camera = { x: 0, y: 0 };
        let particles = [];
        let platforms = [];
        
        const keys = { right: false, left: false, up: false };
        let animTime = 0;

        const player = {
            x: 50, y: 300, vx: 0, vy: 0,
            width: PLAYER_W, height: PLAYER_H,
            grounded: false, faceRight: true
        };

        const skins = [
            { id: 0, name: "Klasik", body: "#3498db", shoes: "#2980b9", price: 0, owned: true, hat: 'none' },
            { id: 1, name: "Sarı", body: "#ffe135", shoes: "#ccad00", price: 0, owned: true, hat: 'none' },
            { id: 2, name: "Buz Mavisi", body: "#00d2ff", shoes: "#007799", price: 0, owned: true, hat: 'none' },
            { id: 3, name: "Gece Moru", body: "#9b59b6", shoes: "#8e44ad", price: 0, owned: true, hat: 'none' },
            { id: 4, name: "Yeşil Doğa", body: "#2ecc71", shoes: "#27ae60", price: 0, owned: true, hat: 'none' },
            { id: 5, name: "Karanlık Mod", body: "#34495e", shoes: "#2c3e50", price: 0, owned: true, hat: 'none' },
            { id: 10, name: "Gümüş", body: "#bdc3c7", shoes: "#95a5a6", price: 0, owned: true, hat: 'none' }, 
            { id: 11, name: "Mars", body: "#e67e22", shoes: "#d35400", price: 0, owned: true, hat: 'none' }, 
            
            { id: 6, name: "Apple Minimal", body: "#ecf0f1", shoes: "#7f8c8d", price: 300, owned: false, hat: 'cap' }, 
            { id: 12, name: "Gezgin", body: "#f39c12", shoes: "#2c3e50", price: 250, owned: false, hat: 'backpack' }, 
            { id: 7, name: "Poker Ustası", body: "#000000", shoes: "#e74c3c", price: 500, owned: false, hat: 'tophat' }, 
            { id: 13, name: "Robot AI", body: "#95a5a6", shoes: "#34495e", price: 450, owned: false, hat: 'antenna' }, 
            { id: 14, name: "Yıldız Savaşçısı", body: "#3498db", shoes: "#2c3e50", price: 750, owned: false, hat: 'helmet' }, 
            { id: 8, name: "Tesla Pilotu", body: "#e74c3c", shoes: "#c0392b", price: 750, owned: false, hat: 'helmet' }, 
            { id: 9, name: "Kral", body: "#f1c40f", shoes: "#e67e22", price: 1000, owned: false, hat: 'crown' }
        ];
        let currentSkinId = 0;

        const nameColors = [
            { id: 0, name: "Standart", color: "#ffffff", price: 0, owned: true },
            { id: 1, name: "Altın", color: "#f1c40f", price: 300, owned: false },
            { id: 2, name: "Alev Kırmızı", color: "#e74c3c", price: 150, owned: false },
            { id: 3, name: "Neon Mavi", color: "#00ffff", price: 150, owned: false },
            { id: 4, name: "Zehir Yeşili", color: "#2ecc71", price: 150, owned: false },
            { id: 5, name: "Matrix", color: "#0f0", price: 400, owned: false }
        ];
        let currentNameColorId = 0;

        const canvas_el = document.getElementById('gameCanvas');
        const ctx_el = canvas_el.getContext('2d');
        const uiLayer = document.getElementById('ui-layer');
        const menuScreen = document.getElementById('menu-screen');
        const skinGrid = document.getElementById('skin-grid');
        const colorGrid = document.getElementById('color-grid');
        const goldDisplays = [document.getElementById('total-gold-display'), document.getElementById('game-gold')];
        const playBtn = document.getElementById('play-btn');
        const closeMenuBtn = document.getElementById('close-menu-btn');
        const msgBox = document.getElementById('message-box');
        const nextLevelBtn = document.getElementById('next-level-btn');
        const loadingScreen = document.getElementById('loading-screen');
        const nameInput = document.getElementById('name-input');
        const uiNameBox = document.getElementById('ui-name-box');

        window.onload = () => {
            resize();
            renderShop();
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 1000);
        };

        function renderShop() {
            playerName = nameInput.value || "Can";
            uiNameBox.innerText = playerName;
            const currentColor = nameColors.find(c => c.id === currentNameColorId).color;
            uiNameBox.style.color = currentColor;
            uiNameBox.style.textShadow = `0 0 5px ${currentColor}`;

            skinGrid.innerHTML = '';
            skins.forEach(skin => {
                const el = document.createElement('div');
                el.className = `shop-item ${skin.id === currentSkinId ? 'selected' : ''} ${(!skin.owned) ? 'locked' : ''}`;
                const pCanvas = document.createElement('canvas');
                pCanvas.width = 50; pCanvas.height = 50; pCanvas.className = 'preview-canvas';
                el.appendChild(pCanvas);
                const pCtx = pCanvas.getContext('2d');
                drawCharacter(pCtx, skin, 10, 5, false, 0, true, true); 
                const name = document.createElement('div'); name.className = 'item-name'; name.innerText = skin.name; el.appendChild(name);
                if (skin.owned) {
                    const tag = document.createElement('div'); tag.className = 'owned-tag'; tag.innerText = "SAHİP OLUNDU";
                    el.appendChild(tag); el.onclick = () => selectSkin(skin.id);
                } else {
                    const price = document.createElement('div'); price.className = 'item-price';
                    price.innerText = skin.price === 0 ? "ÜCRETSİZ" : `${skin.price} ALTIN`;
                    el.appendChild(price); el.onclick = () => buySkin(skin);
                }
                skinGrid.appendChild(el);
            });

            colorGrid.innerHTML = '';
            nameColors.forEach(color => {
                const el = document.createElement('div');
                el.className = `shop-item ${color.id === currentNameColorId ? 'selected' : ''} ${(!color.owned) ? 'locked' : ''}`;
                const pDiv = document.createElement('div'); pDiv.className = 'color-preview';
                pDiv.style.backgroundColor = '#222'; 
                const textPreview = document.createElement('div'); textPreview.innerText = "A";
                textPreview.style.color = color.color; textPreview.style.fontSize = "20px";
                textPreview.style.fontWeight = "bold"; textPreview.style.textShadow = `0 0 5px ${color.color}`;
                pDiv.appendChild(textPreview); el.appendChild(pDiv);
                const name = document.createElement('div'); name.className = 'item-name'; name.innerText = color.name; el.appendChild(name);
                if (color.owned) {
                    const tag = document.createElement('div'); tag.className = 'owned-tag'; tag.innerText = "SEÇ";
                    el.appendChild(tag); el.onclick = () => selectNameColor(color.id);
                } else {
                    const price = document.createElement('div'); price.className = 'item-price';
                    price.innerText = `${color.price} ALTIN`; el.appendChild(price); el.onclick = () => buyNameColor(color);
                }
                colorGrid.appendChild(el);
            });
            updateGoldUI();
        }

        function selectSkin(id) { currentSkinId = id; renderShop(); }
        function buySkin(skin) {
            if (totalGold >= skin.price) { totalGold -= skin.price; skin.owned = true; currentSkinId = skin.id; renderShop(); } 
            else alert("Yetersiz Altın!");
        }
        function selectNameColor(id) { currentNameColorId = id; renderShop(); }
        function buyNameColor(color) {
            if (totalGold >= color.price) { totalGold -= color.price; color.owned = true; currentNameColorId = color.id; renderShop(); } 
            else alert("Yetersiz Altın!");
        }
        function updateGoldUI() { goldDisplays.forEach(d => d.innerText = `ALTIN: ${totalGold}`); }

        function openMenu(isIngame) {
            gameState = isIngame ? 'SHOP_INGAME' : 'MENU';
            menuScreen.style.display = 'flex'; uiLayer.style.display = 'none'; msgBox.style.display = 'none';
            if (isIngame) { playBtn.style.display = 'none'; closeMenuBtn.style.display = 'block'; } 
            else { playBtn.style.display = 'block'; playBtn.innerText = "OYUNA BAŞLA"; closeMenuBtn.style.display = 'none'; }
            renderShop();
        }
        function closeMenu() {
            playerName = nameInput.value || "Can"; uiNameBox.innerText = playerName;
            const currentColor = nameColors.find(c => c.id === currentNameColorId).color;
            uiNameBox.style.color = currentColor; uiNameBox.style.textShadow = `0 0 5px ${currentColor}`;
            menuScreen.style.display = 'none'; uiLayer.style.display = 'block';
            if (gameState === 'SHOP_INGAME') gameState = 'PLAYING'; else startLevel(1);
        }

        nameInput.addEventListener('input', () => { playerName = nameInput.value; uiNameBox.innerText = playerName; });
        playBtn.onclick = () => closeMenu();
        closeMenuBtn.onclick = () => closeMenu();
        document.getElementById('shop-toggle-btn').onclick = () => openMenu(true);
        nextLevelBtn.onclick = () => { if (currentLevel < TOTAL_LEVELS) startLevel(currentLevel + 1); else startLevel(1); };

        window.addEventListener('keydown', (e) => {
            if (document.activeElement === nameInput) return; 
            if (e.code === 'KeyC') { if (gameState === 'PLAYING') openMenu(true); else if (gameState === 'SHOP_INGAME') closeMenu(); }
        });

        function startLevel(lvl) {
            currentLevel = lvl; gameState = 'PLAYING';
            menuScreen.style.display = 'none'; uiLayer.style.display = 'block'; msgBox.style.display = 'none';
            document.getElementById('level-display').innerText = currentLevel;
            player.x = 50; player.y = 300; player.vx = 0; player.vy = 0;
            platforms = []; particles = [];
            generateLevelData(lvl);
        }

        function generateLevelData(lvl) {
            if (lvl === 1) {
                player.x = 50; player.y = 300;
                platforms = [
                    { x: 0, y: 500, w: 600, h: 400, type: 1 }, { x: 300, y: 400, w: 100, h: 20, type: 1 },
                    { x: 500, y: 300, w: 100, h: 20, type: 1 }, { x: 650, y: 500, w: 400, h: 50, type: 2 },
                    { x: 700, y: 200, w: 80, h: 20, type: 1 }, { x: 900, y: 350, w: 100, h: 20, type: 1 },
                    { x: 1100, y: 250, w: 100, h: 20, type: 1 }, { x: 1300, y: 400, w: 50, h: 20, type: 1 },
                    { x: 1450, y: 300, w: 50, h: 20, type: 1 }, { x: 1600, y: 200, w: 200, h: 20, type: 1 },
                    { x: 1750, y: 140, w: 40, h: 60, type: 4 }
                ];
                platforms.push({ x: 340, y: 370, w: 20, h: 20, type: 3, collected: false });
                platforms.push({ x: 540, y: 270, w: 20, h: 20, type: 3, collected: false });
                platforms.push({ x: 730, y: 170, w: 20, h: 20, type: 3, collected: false });
                platforms.push({ x: 940, y: 320, w: 20, h: 20, type: 3, collected: false });
                platforms.push({ x: 1140, y: 220, w: 20, h: 20, type: 3, collected: false });
                platforms.push({ x: 1465, y: 270, w: 20, h: 20, type: 3, collected: false });
                return;
            }
            if (lvl === 2) {
                player.x = 50; player.y = 400;
                platforms = [
                    { x: 0, y: 500, w: 200, h: 400, type: 1 }, { x: 250, y: 450, w: 50, h: 20, type: 1 },
                    { x: 350, y: 380, w: 50, h: 20, type: 1 }, { x: 450, y: 310, w: 50, h: 20, type: 1 },
                    { x: 300, y: 550, w: 1200, h: 50, type: 2 }, { x: 600, y: 310, w: 100, h: 20, type: 1 },
                    { x: 850, y: 310, w: 100, h: 20, type: 1 }, { x: 1050, y: 200, w: 50, h: 20, type: 1 },
                    { x: 1200, y: 150, w: 200, h: 20, type: 1 }, { x: 1500, y: 300, w: 80, h: 20, type: 1 },
                    { x: 1700, y: 400, w: 80, h: 20, type: 1 }, { x: 1900, y: 350, w: 200, h: 400, type: 1 },
                    { x: 2000, y: 290, w: 40, h: 60, type: 4 }
                ];
                platforms.push({ x: 465, y: 280, w: 20, h: 20, type: 3, collected: false });
                platforms.push({ x: 640, y: 280, w: 20, h: 20, type: 3, collected: false });
                platforms.push({ x: 1065, y: 170, w: 20, h: 20, type: 3, collected: false });
                platforms.push({ x: 1250, y: 120, w: 20, h: 20, type: 3, collected: false });
                platforms.push({ x: 1530, y: 270, w: 20, h: 20, type: 3, collected: false });
                return;
            }
            platforms.push({ x: 0, y: 400, w: 400, h: 600, type: 1 });
            let currentX = 400; let currentY = 400; const segmentCount = 15 + Math.floor(lvl * 1.5); 
            for (let i = 0; i < segmentCount; i++) {
                const r = Math.random();
                let gap = 60 + Math.min(lvl * 2, 140) + (Math.random() * 40);
                let width = Math.max(150 - (lvl * 1.5), 40) + (Math.random() * 50);
                let heightChange = (Math.random() - 0.5) * 150;
                if (currentY + heightChange < 150) heightChange = 50; if (currentY + heightChange > 500) heightChange = -50; 
                currentY += heightChange;
                if (r < 0.4) { 
                    currentX += gap; const lavaWidth = gap + width + 100;
                    platforms.push({ x: currentX - 50, y: 600, w: lavaWidth, h: 100, type: 2 });
                    platforms.push({ x: currentX, y: currentY, w: width, h: 20, type: 1 });
                    addGold(currentX, currentY, width); currentX += width;
                } else if (r < 0.8) { 
                    currentX += gap; platforms.push({ x: currentX, y: currentY, w: width, h: 600, type: 1 });
                    addGold(currentX, currentY, width); currentX += width;
                } else { 
                    currentX += gap; platforms.push({ x: currentX, y: currentY, w: 30, h: 600, type: 1 });
                    addGold(currentX, currentY, 30); currentX += 30;
                }
            }
            currentX += 100; platforms.push({ x: currentX, y: currentY, w: 200, h: 600, type: 1 });
            platforms.push({ x: currentX + 80, y: currentY - 60, w: 40, h: 60, type: 4 }); 
        }

        function addGold(x, y, w) {
            if (Math.random() > 0.4) platforms.push({ x: x + w/2 - 10, y: y - 30, w: 20, h: 20, type: 3, collected: false });
        }

        function loop() {
            if (gameState === 'PLAYING') { updatePhysics(); }
            draw(); requestAnimationFrame(loop);
        }

        function updatePhysics() {
            if (keys.right) { player.vx += 1; player.faceRight = true; }
            if (keys.left) { player.vx -= 1; player.faceRight = false; }
            if (keys.up && player.grounded) {
                player.vy = JUMP_FORCE; player.grounded = false;
                createParticles(player.x + player.width/2, player.y + player.height, 10, '#fff');
            }
            player.vx *= FRICTION; player.x += player.vx;
            player.vy += GRAVITY; player.y += player.vy;
            player.grounded = false;
            if (Math.abs(player.vx) > 0.1) animTime += 0.2; else animTime = 0;
            platforms.forEach(p => {
                if (p.type === 1) { 
                    const dir = colCheck(player, p);
                    if (dir === 'l' || dir === 'r') player.vx = 0;
                    else if (dir === 'b') { player.grounded = true; player.vy = 0; }
                    else if (dir === 't') player.vy *= -0.5;
                } else if (p.type === 2) { 
                    if (boxCollision(player, p)) gameOver();
                } else if (p.type === 3) { 
                    if (!p.collected && boxCollision(player, p)) {
                        p.collected = true; totalGold += 10; updateGoldUI();
                        createParticles(p.x, p.y, 10, '#f1c40f');
                    }
                } else if (p.type === 4) { if (boxCollision(player, p)) levelComplete(); }
            });
            if (player.y > 1000) gameOver();
            camera.x += ((player.x - canvas_el.width/2) - camera.x) * 0.1;
            camera.y += ((player.y - canvas_el.height/2) - camera.y) * 0.1;
        }

        function draw() {
            ctx_el.fillStyle = '#2b2b2b'; ctx_el.fillRect(0, 0, canvas_el.width, canvas_el.height);
            if (gameState === 'LOADING') return;
            ctx_el.save(); ctx_el.translate(-camera.x, -camera.y);
            platforms.forEach(p => {
                if (p.type === 1) {
                    ctx_el.fillStyle = '#555'; ctx_el.fillRect(p.x, p.y, p.w, p.h);
                    ctx_el.fillStyle = '#2ecc71'; ctx_el.fillRect(p.x, p.y, p.w, 5);
                } else if (p.type === 2) {
                    const glow = Math.sin(Date.now() / 200) * 0.2 + 0.8;
                    ctx_el.fillStyle = `rgba(231, 76, 60, ${glow})`; ctx_el.fillRect(p.x, p.y, p.w, p.h);
                    ctx_el.fillStyle = '#f1c40f'; ctx_el.fillRect(p.x + (Date.now() % p.w), p.y + Math.random()*10, 5, 5);
                } else if (p.type === 3 && !p.collected) {
                    ctx_el.fillStyle = '#f1c40f'; const bounce = Math.sin(Date.now() / 300) * 3;
                    ctx_el.beginPath(); ctx_el.arc(p.x+10, p.y+10+bounce, 8, 0, Math.PI*2); ctx_el.fill();
                    ctx_el.fillStyle = '#fff'; ctx_el.font = '10px Arial'; ctx_el.fillText('$', p.x+7, p.y+13+bounce);
                } else if (p.type === 4) {
                    ctx_el.fillStyle = '#fff'; ctx_el.fillRect(p.x, p.y, 5, p.h);
                    ctx_el.fillStyle = '#e74c3c'; ctx_el.fillRect(p.x+5, p.y, 30, 20);
                }
            });
            if (gameState === 'PLAYING' || gameState === 'SHOP_INGAME') {
                const isMoving = Math.abs(player.vx) > 0.1;
                drawCharacter(ctx_el, skins.find(s => s.id === currentSkinId), player.x, player.y, isMoving, animTime, player.grounded, player.faceRight);
            }
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.05;
                ctx_el.globalAlpha = p.life; ctx_el.fillStyle = p.c; ctx_el.fillRect(p.x, p.y, 4, 4); ctx_el.globalAlpha = 1;
                if(p.life <= 0) particles.splice(i, 1);
            });
            ctx_el.restore();
        }

        function drawCharacter(context, skin, x, y, isMoving, aTime, isGrounded, faceRight) {
            let stretchY = !isGrounded ? -5 : 0;
            const dx = x; const dy = y + stretchY;
            let leftLegY = 0; let rightLegY = 0;
            if (isMoving && isGrounded) {
                 leftLegY = Math.min(0, Math.sin(aTime) * 6);
                 rightLegY = Math.min(0, Math.sin(aTime + Math.PI) * 6);
            } else if (!isGrounded) { leftLegY = -4; rightLegY = -2; }
            context.fillStyle = skin.shoes;
            context.fillRect(dx + 4, dy + 35 + leftLegY, 8, 8);
            context.fillRect(dx + 18, dy + 35 + rightLegY, 8, 8);
            context.fillStyle = skin.body; context.fillRect(dx, dy, 30, 36); 
            drawHat(context, skin.hat, dx + 15, dy, faceRight);
            context.fillStyle = 'white'; const eyeOff = faceRight ? 4 : -4;
            
            if (skin.hat === 'antenna') context.fillStyle = '#00ffff'; 
            if (skin.hat === 'helmet' && skin.id === 14) context.fillStyle = '#f1c40f'; 

            if (Math.random() > 0.99 && skin.hat !== 'antenna') { 
                context.fillStyle = skin.body; context.fillRect(dx + 6 + eyeOff, dy + 10, 6, 2); context.fillRect(dx + 18 + eyeOff, dy + 10, 6, 2);
            } else {
                context.fillRect(dx + 6 + eyeOff, dy + 8, 6, 6); context.fillRect(dx + 18 + eyeOff, dy + 8, 6, 6);
                context.fillStyle = 'black'; const pupilOff = faceRight ? 2 : 0;
                context.fillRect(dx + 6 + eyeOff + pupilOff, dy + 10, 2, 2); context.fillRect(dx + 18 + eyeOff + pupilOff, dy + 10, 2, 2);
            }
        }

        function drawHat(ctx, type, cx, cy, faceRight) {
            const offX = faceRight ? 2 : -2;
            if (type === 'cap') {
                ctx.fillStyle = '#e74c3c'; ctx.fillRect(cx - 15, cy - 8, 30, 8);
                ctx.fillRect(cx - 15 + (faceRight ? 10 : -5), cy - 4, 25, 4);
            } else if (type === 'tophat') {
                ctx.fillStyle = '#000'; ctx.fillRect(cx - 15, cy - 18, 30, 18);
                ctx.fillRect(cx - 20, cy, 40, 5); ctx.fillStyle = '#c0392b'; ctx.fillRect(cx - 15, cy - 5, 30, 5);
            } else if (type === 'helmet') {
                ctx.fillStyle = '#ecf0f1';
                ctx.beginPath(); ctx.arc(cx, cy + 10, 18, Math.PI, 0); ctx.fill();
                ctx.fillStyle = 'rgba(52, 152, 219, 0.6)';
                ctx.fillRect(cx - 12, cy, 24, 10);
            } else if (type === 'crown') {
                ctx.fillStyle = '#f1c40f'; ctx.strokeStyle = '#d35400'; ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(cx - 15, cy); ctx.lineTo(cx - 15, cy - 18); ctx.lineTo(cx - 7, cy - 8);
                ctx.lineTo(cx, cy - 18); ctx.lineTo(cx + 7, cy - 8); ctx.lineTo(cx + 15, cy - 18);
                ctx.lineTo(cx + 15, cy); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#e74c3c'; ctx.fillRect(cx - 2, cy - 6, 4, 4);
            } else if (type === 'backpack') {
                ctx.fillStyle = '#7f8c8d';
                const bx = faceRight ? cx - 25 : cx + 5;
                ctx.fillRect(bx, cy + 5, 20, 25);
                ctx.fillStyle = '#95a5a6';
                ctx.fillRect(bx + 2, cy + 10, 16, 5);
            } else if (type === 'antenna') {
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - 15); ctx.stroke();
                ctx.fillStyle = '#00ffff'; ctx.beginPath(); ctx.arc(cx, cy - 15, 3, 0, Math.PI*2); ctx.fill();
            }
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('msg-title').innerText = "YANDIN!";
            document.getElementById('msg-title').style.color = "#e74c3c";
            document.getElementById('msg-text').innerText = `${playerName}, denemeye devam et!\nSeviye: ${currentLevel}\nAltın: ${totalGold}`;
            nextLevelBtn.innerText = "TEKRAR DENE";
            nextLevelBtn.onclick = () => startLevel(currentLevel);
            msgBox.style.display = 'block';
        }

        function levelComplete() {
            gameState = 'LEVEL_COMPLETE';
            document.getElementById('msg-title').innerText = "SEVİYE TAMAM!";
            document.getElementById('msg-title').style.color = "#2ecc71";
            document.getElementById('msg-text').innerText = `Harika iş ${playerName}!\nSıradaki seviye daha zor.`;
            nextLevelBtn.innerText = "DEVAM ET";
            nextLevelBtn.onclick = () => {
                if(currentLevel < TOTAL_LEVELS) startLevel(currentLevel+1);
                else {
                    document.getElementById('msg-title').innerText = "OYUN BİTTİ!";
                    document.getElementById('msg-text').innerText = `Tebrikler ${playerName}!\nTüm seviyeleri bitirdin.`;
                    nextLevelBtn.innerText = "BAŞA DÖN";
                    nextLevelBtn.onclick = () => startLevel(1);
                }
            };
            msgBox.style.display = 'block';
        }

        function colCheck(shapeA, shapeB) {
            let vX = (shapeA.x + (shapeA.width / 2)) - (shapeB.x + (shapeB.w / 2));
            let vY = (shapeA.y + (shapeA.height / 2)) - (shapeB.y + (shapeB.h / 2));
            let hWidths = (shapeA.width / 2) + (shapeB.w / 2);
            let hHeights = (shapeA.height / 2) + (shapeB.h / 2);
            let colDir = null;
            if (Math.abs(vX) < hWidths && Math.abs(vY) < hHeights) {
                let oX = hWidths - Math.abs(vX); let oY = hHeights - Math.abs(vY);
                if (oX >= oY) {
                    if (vY > 0) { colDir = "t"; shapeA.y += oY; } else { colDir = "b"; shapeA.y -= oY; }
                } else {
                    if (vX > 0) { colDir = "l"; shapeA.x += oX; } else { colDir = "r"; shapeA.x -= oX; }
                }
            }
            return colDir;
        }
        function boxCollision(obj1, obj2) {
            return (obj1.x < obj2.x + obj2.w && obj1.x + obj1.width > obj2.x && obj1.y < obj2.y + obj2.h && obj1.y + obj1.height > obj2.y);
        }
        function createParticles(x, y, count, c) {
            for(let i=0; i<count; i++) particles.push({x:x, y:y, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5, life:1, c:c});
        }
        function resize() { canvas_el.width = window.innerWidth; canvas_el.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        
        window.addEventListener('keydown', e => {
            if (document.activeElement === document.getElementById('name-input')) return;
            if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=true;
            if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=true;
            if((e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW') && player.grounded) keys.up=true;
            if(e.code === 'KeyC') { if (gameState === 'PLAYING') openMenu(true); else if (gameState === 'SHOP_INGAME') closeMenu(); }
        });
        window.addEventListener('keyup', e => {
            if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=false;
            if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=false;
            if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW') keys.up=false;
        });
        
        ['btn-left','btn-right','btn-jump'].forEach(id=>{
            document.getElementById(id).addEventListener('touchstart',e=>{
                e.preventDefault();
                if(id==='btn-jump' && player.grounded) keys.up=true;
                else if(id==='btn-left') keys.left=true;
                else if(id==='btn-right') keys.right=true;
            });
            document.getElementById(id).addEventListener('touchend',e=>{
                e.preventDefault();
                if(id==='btn-jump') keys.up=false;
                else if(id==='btn-left') keys.left=false;
                else if(id==='btn-right') keys.right=false;
            });
        });

        loop();

    </script>
</body>
